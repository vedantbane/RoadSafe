<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Reports – RoadSafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
<div class="nav-container">
<a href="index.html" class="logo">
<span class="logo-icon">■■</span>
RoadSafe
</a>
<div class="nav-links">
<a href="index.html">Home</a>
<a href="report.html">Report</a>
<a href="reports.html" class="active">View Reports</a>
<a href="tips.html">Safety Tips</a>
<a href="about.html">About</a>
</div>
<div class="nav-actions">
<button class="theme-toggle" aria-label="Toggle theme">■</button>
<a href="report.html" class="btn btn-primary">Report Issue</a>
</div>
<button class="hamburger" aria-label="Menu">
<span></span><span></span><span></span>
</button>
</div>
</nav>
<div class="page-header">
<h1>Community Reports</h1>
<p>Browse active and resolved road hazards reported by citizens.</p>
</div>
<section class="section">
<div class="container">
<div class="map-section">
<h2 style="margin-bottom:1rem;font-size:1.4rem;">■■ Live Map</h2>
<div id="map"></div>
</div>
<div class="filters">
<input type="search" id="searchReports" placeholder="Search location or title..." class="form-control" style="min-width:200px;flex:1;">
<select id="filterStatus">
<option value="all">All Status</option>
<option value="Pending">Pending</option>
<option value="Under Review">Under Review</option>
<option value="In Progress">In Progress</option>
<option value="Resolved">Resolved</option>
<option value="Rejected">Rejected</option>
</select>
<select id="filterSeverity">
<option value="all">All Severity</option>
<option value="high">High</option>
<option value="medium">Medium</option>
<option value="low">Low</option>
</select>

<a href="report.html" class="btn btn-primary btn-sm">+ New Report</a>
</div>
<div class="reports-grid" id="reportsGrid">
<!-- Filled by JS -->
</div>
</div>
</section>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
