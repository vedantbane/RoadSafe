<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Account - RoadSafe</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body>
<nav class="navbar top-navbar"><div class="nav-container"><a href="/index.html" class="logo"><span class="logo-icon">RS</span>RoadSafe</a><div class="nav-links"><a href="/index.html">Home</a><a href="/report.html">Report</a><a href="/reports.html">Reports</a><a href="/account.html" class="active">Account</a><a href="/admin.html">Admin</a></div><div class="nav-actions"><button class="theme-toggle" type="button" aria-label="Toggle theme">◐</button></div></div></nav><div class="page-header"><h1>Your Account</h1><p>Sign in to keep track of reports submitted from your account.</p></div><section class="section"><div class="container"><div id="authPanel" class="auth-layout"><form class="form-card" id="loginForm"><h2>Sign in</h2><div class="form-group"><label>Email</label><input class="form-control" name="email" type="email" required></div><div class="form-group"><label>Password</label><input class="form-control" name="password" type="password" required></div><button class="btn btn-primary" type="submit">Sign in</button></form><form class="form-card" id="registerForm"><h2>Create account</h2><div class="form-group"><label>Name</label><input class="form-control" name="name" type="text"></div><div class="form-group"><label>Email</label><input class="form-control" name="email" type="email" required></div><div class="form-group"><label>Password</label><input class="form-control" name="password" type="password" minlength="8" required></div><button class="btn btn-primary" type="submit">Create account</button></form></div><div id="accountPanel" hidden><div class="account-heading"><div><h2 id="accountName"></h2><p>Your submitted reports</p></div><button class="btn btn-outline" id="logoutButton" type="button">Sign out</button></div><div class="form-card" id="adminPromotionPanel" hidden><h2>Admin access</h2><p>Enter the master admin passcode to promote this account.</p><div class="form-group"><label for="adminPasscodeInput">Master admin passcode</label><input class="form-control" id="adminPasscodeInput" type="password"></div><button class="btn btn-primary" id="promoteAdminButton" type="button">Promote to admin</button></div><div class="reports-grid" id="myReportsGrid"></div></div></div></section>
